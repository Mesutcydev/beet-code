name: BeetCode
options:
  bundleIdPrefix: com.beetcode
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # Xcode 16-era pbxproj (objectVersion 77) opens in Xcode 26.x and 27.x.
  projectFormat: xcode16_0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64

packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    version: "0.31.4"
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    version: "3.31.4"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  BeetCode:
    type: application
    platform: macOS
    sources:
      - App
      - Core
    resources:
      - App/Assets.xcassets
    dependencies:
      - package: MLX
        products:
          - MLX
      - package: MLXLM
        products:
          - MLXLLM
          - MLXLMCommon
          - MLXVLM
      - package: SwiftTransformers
        products:
          - Tokenizers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Beet Code"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.9.3"
        CFBundleVersion: "16"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 BeetCode contributors"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Stable signature across rebuilds: ad-hoc ("-") gives every binary a
        # new cdhash, so Keychain's "Always Allow" never sticks and the app
        # re-prompts for every item on every launch. A real development
        # identity keeps the designated requirement stable — one Always
        # Allow, forever. (Test target stays ad-hoc on purpose.)
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "438VSM6P5L"

  BeetCodeCLI:
    type: tool
    platform: macOS
    sources:
      - Core
      - CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: MLX
        products:
          - MLX
      - package: MLXLM
        products:
          - MLXLLM
          - MLXLMCommon
          - MLXVLM
      - package: SwiftTransformers
        products:
          - Tokenizers

  BeetCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: BeetCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BeetCode.app/Contents/MacOS/BeetCode"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BeetCode:
    build:
      targets:
        BeetCode: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeetCodeTests
  BeetCodeCLI:
    build:
      targets:
        BeetCodeCLI: all
    run:
      config: Debug
