name: BeetCode
options:
  bundleIdPrefix: com.beetcode
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64

packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.0"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  BeetCode:
    type: application
    platform: macOS
    sources:
      - App
      - Core
    resources:
      - App/Assets.xcassets
    dependencies:
      - package: MLXLM
        products:
          - MLXLLM
          - MLXLMCommon
      - package: SwiftTransformers
        products:
          - Tokenizers
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Beet Code"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.app
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BeetCodeCLI:
    type: tool
    platform: macOS
    sources:
      - Core
      - CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: MLXLM
        products:
          - MLXLLM
          - MLXLMCommon
      - package: SwiftTransformers
        products:
          - Tokenizers

  BeetCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: BeetCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetcode.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BeetCode.app/Contents/MacOS/BeetCode"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BeetCode:
    build:
      targets:
        BeetCode: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeetCodeTests
  BeetCodeCLI:
    build:
      targets:
        BeetCodeCLI: all
    run:
      config: Debug
